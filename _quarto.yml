project:
  type: website
  output-dir: docs

website:
  title: "A Blog With Python Thanks to Quarto"
  comments: 
    giscus:
      repo: charliejhadley/create-your-own-data-blog-with-quarto-and-python-5968001
  twitter-card:
    title: "Charlotte's Data Blog"
    description: "Python blogging with Quarto for LinkedIn Learning"
  open-graph:
    title: "Charlotte's Data Blog"
    description: "Using Quarto to blog with Python via LinkedIn Learning"
  navbar:
    left:
      - text: "Data blog"
        icon: pie-chart-fill
        href: data-blog.qmd
      - icon: joystick
        text: "Side Projects"
        menu:
          - text: "Data projects"
          - text: "Shiny fishing game"
            href: side-projects/shiny-fishing-project/index.qmd
