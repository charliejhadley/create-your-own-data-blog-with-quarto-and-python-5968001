      - icon: github
        href: https://github.com/
  page-footer:
    foreground: rebeccapurple
    left: |
      This blog was written by Charlotte Hadley
      <br>I hope you enjoy it!
    center:
      - text: "<i class='fa-solid fa-otter'></i> This works in the same way as the navbar"
    right:
      - icon: github
        href: https://github.com/charliejhadley/create-your-own-data-blog-with-quarto-and-python-5968001
